name: cisco_frontend
description: Cisco Frontend Application with API Configuration and Authentication
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # URL Launcher for downloads
  url_launcher: ^6.2.2

  # UI Components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
